          python3 - <<'PYCODE'
          import os, json, base64
          from pathlib import Path
          for name, content in json.loads(base64.b64decode(os.environ['BLOG_FILES'])).items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)
